<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img">
<defs>
<pattern id="adots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2542"/></pattern>
<linearGradient id="abd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset=".55" stop-color="#1b2542"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<linearGradient id="aglow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
</defs>
<style>
.at{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#f2f4fb} .am{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#8b95ad} .ad{font-family:Impact,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;fill:#f2f4fb}

.asl{animation:as 12s infinite both} @keyframes as{0%{opacity:0;transform:translateX(24px)}3%{opacity:1;transform:none}30%{opacity:1;transform:none}33.3%{opacity:0;transform:translateX(-24px)}100%{opacity:0}}
.apb{transform-box:fill-box;transform-origin:left;animation:ap 12s infinite both} @keyframes ap{0%{transform:scaleX(0)}33.3%{transform:scaleX(1)}33.4%,100%{transform:scaleX(0)}}
.ain{animation:ai .7s ease both} @keyframes ai{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="900" height="360" rx="22" fill="#070b16"/>
<rect width="900" height="360" rx="22" fill="url(#adots)"/>
<rect x=".75" y=".75" width="898.5" height="358.5" rx="21.5" fill="none" stroke="url(#abd)" stroke-width="1.5"/>
<text x="48" y="64" font-size="14" letter-spacing="3" class="am" fill="#ff354f">WHAT I DO</text><g class="ain" style="animation-delay:0.0s"><rect x="48" y="94" width="6" height="44" rx="3" fill="url(#aglow)"/><text x="70" y="114" font-size="20" font-weight="700" class="at">Full-stack web apps</text><text x="70" y="136" font-size="14" class="at" fill="#8b95ad">React frontends + Flask / Express APIs</text></g><g class="ain" style="animation-delay:0.15s"><rect x="48" y="154" width="6" height="44" rx="3" fill="url(#aglow)"/><text x="70" y="174" font-size="20" font-weight="700" class="at">Databases</text><text x="70" y="196" font-size="14" class="at" fill="#8b95ad">MongoDB, MySQL, SQLite, Firebase</text></g><g class="ain" style="animation-delay:0.3s"><rect x="48" y="214" width="6" height="44" rx="3" fill="url(#aglow)"/><text x="70" y="234" font-size="20" font-weight="700" class="at">Shipping</text><text x="70" y="256" font-size="14" class="at" fill="#8b95ad">Deploys on Render and Vercel</text></g><g class="ain" style="animation-delay:0.44999999999999996s"><rect x="48" y="274" width="6" height="44" rx="3" fill="url(#aglow)"/><text x="70" y="294" font-size="20" font-weight="700" class="at">Clean code</text><text x="70" y="316" font-size="14" class="at" fill="#8b95ad">Readable, understandable, maintained</text></g><rect x="470" y="40" width="382" height="280" rx="18" fill="#0b1226" stroke="url(#abd)" stroke-width="1.5"/><text x="496" y="76" font-size="13" letter-spacing="3" class="am" fill="#247bff">INTERESTS</text><g class="asl" style="animation-delay:0s" opacity="1"><text x="496" y="150" font-size="27" font-weight="800" class="ad" fill="#f2f4fb">Learning by building</text><text x="496" y="190" font-size="16" class="at" fill="#c5cbe0">I improve existing features, try</text><text x="496" y="216" font-size="16" class="at" fill="#c5cbe0">new ideas and document the progress</text><text x="496" y="242" font-size="16" class="at" fill="#c5cbe0">on GitHub.</text></g><g class="asl" style="animation-delay:4s" opacity="0"><text x="496" y="150" font-size="27" font-weight="800" class="ad" fill="#f2f4fb">Tech news and PWAs</text><text x="496" y="190" font-size="16" class="at" fill="#c5cbe0">TechPulse: a live tech news PWA</text><text x="496" y="216" font-size="16" class="at" fill="#c5cbe0">with auto-refresh, built as a</text><text x="496" y="242" font-size="16" class="at" fill="#c5cbe0">single HTML file.</text></g><g class="asl" style="animation-delay:8s" opacity="0"><text x="496" y="150" font-size="27" font-weight="800" class="ad" fill="#f2f4fb">3D on the web</text><text x="496" y="190" font-size="16" class="at" fill="#c5cbe0">A walk-through 3D portfolio world</text><text x="496" y="216" font-size="16" class="at" fill="#c5cbe0">with React and Three.js.</text></g><rect x="496" y="290" width="104" height="5" rx="2.5" fill="#1b2542"/><rect class="apb" style="animation-delay:0s" x="496" y="290" width="104" height="5" rx="2.5" fill="url(#aglow)" transform="scale(0 1)"/><rect x="608" y="290" width="104" height="5" rx="2.5" fill="#1b2542"/><rect class="apb" style="animation-delay:4s" x="608" y="290" width="104" height="5" rx="2.5" fill="url(#aglow)" transform="scale(0 1)"/><rect x="720" y="290" width="104" height="5" rx="2.5" fill="#1b2542"/><rect class="apb" style="animation-delay:8s" x="720" y="290" width="104" height="5" rx="2.5" fill="url(#aglow)" transform="scale(0 1)"/></svg>