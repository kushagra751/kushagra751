<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img">
<defs>
<pattern id="hdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#1b2542"/></pattern>
<linearGradient id="hbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset=".55" stop-color="#1b2542"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
<linearGradient id="hglow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
</defs>
<style>
.ht{font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#f2f4fb} .hm{font-family:SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;fill:#8b95ad} .hd{font-family:Impact,'Arial Narrow Bold','Helvetica Neue',Arial,sans-serif;fill:#f2f4fb}

.htype{animation:htyp 1.6s steps(18) both} @keyframes htyp{from{width:0}to{width:300px}}
.hrise{animation:hrs 1s cubic-bezier(.2,.8,.2,1) .8s both} @keyframes hrs{from{transform:translateY(130px)}to{transform:translateY(0)}}
.hrole{animation:hrl 12s infinite both} @keyframes hrl{0%{opacity:0;transform:translateY(14px)}4%{opacity:1;transform:none}21%{opacity:1;transform:none}25%{opacity:0;transform:translateY(-14px)}100%{opacity:0}}
.hfade{animation:hfd .8s ease 2s both} @keyframes hfd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hfloat{animation:hfl 5s ease-in-out infinite} @keyframes hfl{50%{transform:translateY(-6px)}}
.hcur{animation:hbl 1s steps(1) infinite} @keyframes hbl{50%{opacity:0}}

@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="900" height="420" rx="22" fill="#070b16"/>
<rect width="900" height="420" rx="22" fill="url(#hdots)"/>
<rect x=".75" y=".75" width="898.5" height="418.5" rx="21.5" fill="none" stroke="url(#hbd)" stroke-width="1.5"/>
<clipPath id="hc1"><rect class="htype" x="52" y="40" width="300" height="34"/></clipPath><text x="52" y="66" font-size="22" class="hm" fill="#247bff" clip-path="url(#hc1)">&gt; hello, world. I am</text><rect class="hcur" x="338" y="46" width="10" height="22" fill="#ff354f" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.01s" begin="1.6s" fill="freeze"/></rect><clipPath id="hc2"><rect x="48" y="80" width="600" height="130"/></clipPath><g clip-path="url(#hc2)"><g class="hrise"><text x="46" y="188" font-size="116" font-weight="900" textLength="570" lengthAdjust="spacingAndGlyphs" class="hd">KUSHAGRA</text></g></g><rect x="52" y="214" width="120" height="4" rx="2" fill="url(#hglow)" class="hfade"/><text class="ht hrole" style="animation-delay:0s" opacity="1" x="52" y="262" font-size="30" font-weight="700" fill="#247bff">Full Stack Developer</text><text class="ht hrole" style="animation-delay:3s" opacity="0" x="52" y="262" font-size="30" font-weight="700" fill="#247bff">Flask + React Builder</text><text class="ht hrole" style="animation-delay:6s" opacity="0" x="52" y="262" font-size="30" font-weight="700" fill="#247bff">B.Tech CSE Student</text><text class="ht hrole" style="animation-delay:9s" opacity="0" x="52" y="262" font-size="30" font-weight="700" fill="#247bff">Learning by Shipping</text><text class="ht hfade" x="52" y="306" font-size="17" fill="#c5cbe0">I build practical, user-focused web apps, from React frontends</text><text class="ht hfade" x="52" y="330" font-size="17" fill="#c5cbe0">to Flask and Node backends, and learn by shipping them.</text><g class="hfade"><rect x="52" y="358" width="69.0" height="34" rx="17" fill="#0e1830" stroke="#243257"/><text x="66" y="380" font-size="14" class="hm" fill="#c5cbe0">India</text></g><g class="hfade"><rect x="150" y="358" width="241.2" height="34" rx="17" fill="#0e1830" stroke="#243257"/><text x="164" y="380" font-size="14" class="hm" fill="#c5cbe0">Intern @ XenoTech Solution</text></g><g class="hfade"><rect x="420" y="358" width="257.59999999999997" height="34" rx="17" fill="#0e1830" stroke="#243257"/><text x="434" y="380" font-size="14" class="hm" fill="#c5cbe0">B.Tech CSE, Parul University</text></g><g class="hfloat"><circle cx="760.0" cy="210.0" r="104.0" fill="#0e1830" stroke="url(#hglow)" stroke-width="3"/><text x="760.0" y="246.4" text-anchor="middle" font-size="114.4" class="hd" fill="#247bff">K</text></g></svg>